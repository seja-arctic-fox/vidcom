app-id: io.github.seja_arctic_fox.vidcom
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: vidcom
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/giomm-2.68/
  - /lib/sigc++-3.0/

modules:
  - name: jsoncpp
    buildsystem: meson
    config-opts:
      - -Dtests=false
    sources: 
      - type: archive
        url: https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/1.9.8.tar.gz
        sha256: 51828cf3574281d2b79ec2a1c56a9e4c20cc1103711321ea96384cffb8d2d904

  - name: libsigcplusplus
    buildsystem: meson
    config-opts:
      - -Dmaintainer-mode=false
      - -Dbuild-documentation=false
      - -Dbuild-manual=false
      - -Dvalidation=false
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    sources: 
      - type: archive
        url: https://github.com/libsigcplusplus/libsigcplusplus/releases/download/3.8.1/libsigc++-3.8.1.tar.xz
        sha256: 4ff41d1474e501d3baeced4c989d154338206ac16471e614376496b63fe252d1

  - name: glibmm
    buildsystem: meson
    config-opts:
      - -Dmaintainer-mode=false
      - -Dbuild-documentation=false
      - -Dbuild-examples=false
    cleanup:
      - '/lib/glibmm-*'
    sources: 
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.90/glibmm-2.90.0.tar.xz
        sha256: e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b

  - name: cairomm
    buildsystem: meson
    config-opts:
      - -Dmaintainer-mode=false
      - -Dbuild-documentation=false
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    cleanup:
      - '/lib/cairomm-*'
    sources:
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.19.1.tar.xz
        sha256: 06881a0167d84962c74db318427c5be663d30b8ea5c60740a9dc36a9c1961b54

  - name: pangomm
    buildsystem: meson
    config-opts:
      - -Dmaintainer-mode=false
      - -Dbuild-documentation=false
    cleanup:
      - '/lib/pangomm-*'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.58/pangomm-2.58.0.tar.xz
        sha256: 217514c1a65035c2fce6e69e33b0d92bafa2594cc474e995a4473441b10f3a33

  - name: gtkmm
    buildsystem: meson
    config-opts:
      - -Dmaintainer-mode=false
      - -Dbuild-documentation=false
      - -Dbuild-demos=false
      - -Dbuild-tests=false
    cleanup:
      - '/lib/gtkmm-*'
    sources: 
    - type: archive
      url: https://download.gnome.org/sources/gtkmm/4.24/gtkmm-4.24.0.tar.xz
      sha256: 7fd9cea356e7d3b74bf7d2a51d7e0e6763f3f9f1cddc5e77c8b0b5b7fa9d5e5a

  - name: vidcom
    buildsystem: meson
    sources:
      - type: dir
        path: ../

# Deps versions according to gnome-build-meta repository
